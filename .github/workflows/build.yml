name: Gerar EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller
        run: pip install pyinstaller

      - name: Gerar o .exe
        run: pyinstaller --onefile --windowed --name Vetorial main.py

      - uses: actions/upload-artifact@v4
        with:
          name: Vetorial
          path: dist/Vetorial.exe
